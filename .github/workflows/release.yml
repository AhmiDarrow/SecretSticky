name: Release

# SecretSticky 1.0 and later: the RemedyUI build in remedyui/. Installed Tauri builds
# (0.1.2 to 0.2.0) update to it: they read latest.json from the newest release, check the
# installer's signature with the key in src-tauri/tauri.conf.json, and run it; the installer
# takes over their install and leaves the vault in %APPDATA%\SecretSticky alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # remedyui/Cargo.toml finds RemedyUI at ../../Projects/RemedyUI.
      - name: Checkout SecretSticky
        uses: actions/checkout@v4
        with:
          path: SecretSticky

      - name: Checkout RemedyUI
        uses: actions/checkout@v4
        with:
          repository: AhmiDarrow/RemedyUI
          ref: main
          path: Projects/RemedyUI
          token: ${{ secrets.REMEDYUI_READ_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Install cargo-remedy
        run: cargo install --locked --path Projects/RemedyUI/crates/cargo-remedy

      - name: Package and sign
        working-directory: SecretSticky/remedyui
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REMEDY_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Missing repo secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; fi
          # Tauri keeps the minisign key file base64-encoded.
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/update.key"
          REMEDY_UPDATE_KEY="$RUNNER_TEMP/update.key" cargo remedy package
          rm -f "$RUNNER_TEMP/update.key"

      - name: Write latest.json
        working-directory: SecretSticky/remedyui/target/remedy/dist
        run: |
          version=$(grep -m1 '^version' ../../../Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME}"
          [ "$tag" = "v$version" ] || { echo "::error::tag $tag is not v$version"; exit 1; }
          setup="SecretSticky_${version}_x64-setup.exe"
          [ -f "$setup" ] && [ -f "$setup.sig" ] || { echo "::error::$setup or its .sig is missing"; exit 1; }
          # Tauri's feed: the signature is the .sig file, base64-encoded.
          sig=$(base64 -w0 "$setup.sig")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${setup}"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "See https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md",
            "pub_date": "${now}",
            "platforms": {
              "windows-x86_64": { "signature": "${sig}", "url": "${url}" },
              "windows-x86_64-nsis": { "signature": "${sig}", "url": "${url}" },
              "windows-x86_64-msi": { "signature": "${sig}", "url": "${url}" }
            }
          }
          EOF
          cat latest.json

      - name: Draft the release
        working-directory: SecretSticky/remedyui/target/remedy/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' ../../../Cargo.toml | cut -d'"' -f2)
          setup="SecretSticky_${version}_x64-setup.exe"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "SecretSticky $GITHUB_REF_NAME" \
            --notes "Encrypted sticky notes for Windows, now on RemedyUI. Installed 0.1.2 and later update in place from About → Check for updates; your vault in %APPDATA%\\SecretSticky is kept. See CHANGELOG.md." \
            "$setup" "$setup.sig" "SecretSticky_${version}_x64-portable.zip" "SecretSticky_${version}_x64-portable.zip.sig" latest.json
